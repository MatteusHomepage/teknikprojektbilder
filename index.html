<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101312" />
    <title>Photo Album</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101312;
        --panel: #191e1c;
        --text: #f2f5f2;
        --muted: #9ba8a1;
        --line: #303a34;
        --accent: #b9e4c9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -20%, #29372f, transparent 55%),
          var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      header,
      nav,
      main {
        width: min(1120px, calc(100% - 36px));
        margin: auto;
      }
      header {
        padding: 34px 0 16px;
      }
      h1 {
        font-size: clamp(34px, 6vw, 56px);
        line-height: 1;
        letter-spacing: -0.05em;
        margin: 0;
      }
      nav {
        padding: 12px 0 22px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 16px;
        background: #202824;
        color: var(--text);
      }
      button:hover,
      button:focus-visible {
        outline: none;
        border-color: var(--accent);
      }
      #add {
        background: var(--accent);
        color: #142019;
        border-color: var(--accent);
        font-weight: 650;
        min-width: 180px;
        transition: 0.18s;
      }
      #add:hover,
      #add.dragover {
        background: #d0f0dc;
        transform: translateY(-1px);
      }
      #file {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        padding-bottom: 36px;
      }
      .card {
        position: relative;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .photo {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        background: #252b28;
        cursor: zoom-in;
      }
      .details {
        padding: 12px 14px 15px;
      }
      .details h2 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .details p {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .actions {
        position: absolute;
        right: 9px;
        top: 9px;
        display: flex;
        gap: 7px;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        background: #111a18dd;
        backdrop-filter: blur(8px);
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-btn.delete:hover {
        background: #913b3b;
        border-color: #e58a8a;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        color: var(--muted);
        padding: 70px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
      }
      dialog {
        width: min(92vw, 520px);
        max-height: 90vh;
        overflow: auto;
        border: 1px solid #48534c;
        border-radius: 16px;
        padding: 22px;
        background: #171d19;
        color: var(--text);
      }
      dialog::backdrop {
        background: #000b;
        backdrop-filter: blur(4px);
      }
      dialog h2 {
        margin: 0 0 16px;
        font-size: 21px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 13px 0 6px;
      }
      input[type="text"],
      textarea {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: #0f1411;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 11px;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      .preview {
        display: block;
        max-width: 100%;
        max-height: 210px;
        object-fit: contain;
        margin: 0 auto 14px;
        border-radius: 8px;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .primary {
        background: var(--accent);
        color: #142019;
        border-color: var(--accent);
        font-weight: 650;
      }
      #viewer {
        width: min(96vw, 1100px);
        padding: 0;
        background: #101312;
        border-radius: 14px;
        position: relative;
      }
      #viewer img {
        display: block;
        max-width: 100%;
        max-height: 82vh;
        object-fit: contain;
        margin: auto;
      }
      .viewer-bar {
        display: flex;
        justify-content: center;
        padding: 10px 14px;
      }
      .viewer-bar strong {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
      }
      .close {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        background: #111a18dd;
        z-index: 2;
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 540px) {
        header {
          padding-top: 26px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .photo {
          aspect-ratio: 5/4;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        Matteus, Julie, Alicia, Abdi, Theo och Wenji teknik bilder.<span style="color: var(--accent)">.</span>
      </h1>
    </header>
    <nav>
      <button id="add" type="button">＋ Lägg till bilder</button
      ><input id="file" type="file" accept="image/*" multiple />
    </nav>
    <main>
      <section class="grid" id="grid" aria-label="Bildalbum"></section>
    </main>
    <dialog id="editDialog">
      <form id="editForm">
        <h2 id="formHeading">Lägg till bild</h2>
        <img id="preview" class="preview" alt="" />
        <label for="title">Bildens namn</label
        ><input
          id="title"
          type="text"
          maxlength="100"
          placeholder="Skriv ett namn"
        />
        <label for="caption">Text under bilden</label
        ><textarea
          id="caption"
          maxlength="1000"
          placeholder="Skriv en beskrivning eller annan text..."
        ></textarea>
        <div class="form-actions">
          <button type="button" id="cancel">Avbryt</button
          ><button class="primary" type="submit">Spara</button>
        </div>
      </form>
    </dialog>
    <dialog id="viewer">
      <button
        class="close"
        id="closeViewer"
        type="button"
        aria-label="Stäng"
        title="Stäng"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg></button
      ><img id="large" alt="" />
      <div class="viewer-bar"><strong id="viewerTitle"></strong></div>
    </dialog>
    <script>
      const DB_NAME = "photoAlbum_clean_v3",
        DB_VERSION = 1;
      let db,
        pendingBlob = null,
        pendingName = "",
        editingId = null,
        previewUrl = null;
      const $ = (id) => document.getElementById(id),
        grid = $("grid"),
        fileInput = $("file"),
        addButton = $("add"),
        editDialog = $("editDialog"),
        viewer = $("viewer");
      let cardUrls = [];
      function openDatabase() {
        return new Promise((resolve, reject) => {
          const r = indexedDB.open(DB_NAME, DB_VERSION);
          r.onupgradeneeded = () =>
            r.result.createObjectStore("photos", { keyPath: "id" });
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        });
      }
      function request(store, mode, method, value) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction("photos", mode),
            s = tx.objectStore("photos");
          const r = value === undefined ? s[method](method) : s[method](value);
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        });
      }
      const getAll = () =>
        new Promise((resolve, reject) => {
          const r = db
            .transaction("photos", "readonly")
            .objectStore("photos")
            .getAll();
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        });
      const put = (p) =>
        new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").put(p);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      const remove = (id) =>
        new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").delete(id);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      function iconButton(cls, label, path) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "icon-btn " + cls;
        b.title = label;
        b.setAttribute("aria-label", label);
        b.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true">' + path + "</svg>";
        return b;
      }
      async function render() {
        cardUrls.forEach(URL.revokeObjectURL);
        cardUrls = [];
        const photos = await getAll();
        grid.replaceChildren();
        if (!photos.length) {
          const e = document.createElement("div");
          e.className = "empty";
          e.textContent =
            "Ditt album är tomt. Lägg till en bild för att börja.";
          grid.append(e);
          return;
        }
        for (const p of photos) {
          const card = document.createElement("article");
          card.className = "card";
          const url = URL.createObjectURL(p.blob);
          cardUrls.push(url);
          const img = document.createElement("img");
          img.className = "photo";
          img.src = url;
          img.alt = p.title;
          img.loading = "lazy";
          img.addEventListener("click", () => openViewer(url, p.title));
          const d = document.createElement("div");
          d.className = "details";
          const h = document.createElement("h2");
          h.textContent = p.title;
          d.append(h);
          if (p.caption) {
            const t = document.createElement("p");
            t.textContent = p.caption;
            d.append(t);
          }
          const actions = document.createElement("div");
          actions.className = "actions";
          const edit = iconButton(
            "",
            "Redigera",
            '<path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/>',
          );
          edit.addEventListener("click", () => openEditor(p));
          const del = iconButton(
            "delete",
            "Ta bort",
            '<path d="M3 6h18M8 6V4h8v2m3 0-.8 14H5.8L5 6m4 4v6m6-6v6"/>',
          );
          del.addEventListener("click", async () => {
            if (confirm('Ta bort bilden "' + p.title + '"?')) {
              await remove(p.id);
              await render();
            }
          });
          actions.append(edit, del);
          card.append(img, d, actions);
          grid.append(card);
        }
      }
      function openViewer(url, title) {
        $("large").src = url;
        $("large").alt = title;
        $("viewerTitle").textContent = title;
        viewer.showModal();
      }
      function openEditor(p) {
        editingId = p?.id ?? null;
        pendingBlob = p?.blob ?? pendingBlob;
        $("formHeading").textContent = p ? "Redigera bild" : "Lägg till bild";
        $("title").value = p?.title ?? pendingName.replace(/\.[^.]+$/, "");
        $("caption").value = p?.caption ?? "";
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(pendingBlob);
        $("preview").src = previewUrl;
        editDialog.showModal();
        $("title").focus();
      }
      function closeEditor() {
        if (editDialog.open) editDialog.close();
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;
        pendingBlob = null;
        pendingName = "";
        editingId = null;
      }
      async function saveSelectedFiles(list) {
        for (const f of [...list].filter((x) => x.type.startsWith("image/"))) {
          pendingBlob = f;
          pendingName = f.name;
          openEditor(null);
          const save = await new Promise((resolve) => {
            const fn = () => {
              editDialog.removeEventListener("close", fn);
              resolve(editDialog.returnValue === "save");
            };
            editDialog.addEventListener("close", fn);
          });
          if (save) {
            await put({
              id: crypto.randomUUID(),
              blob: pendingBlob,
              title: $("title").value.trim() || "Namnlös bild",
              caption: $("caption").value.trim(),
              created: Date.now(),
            });
            closeEditor();
            await render();
          } else closeEditor();
        }
      }
      $("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = $("title").value.trim() || "Namnlös bild",
          caption = $("caption").value.trim();
        if (editingId) {
          const p = (await getAll()).find((x) => x.id === editingId);
          if (p) await put({ ...p, title, caption });
          editDialog.close("save");
          closeEditor();
          await render();
        } else editDialog.close("save");
      });
      $("cancel").addEventListener("click", () => {
        editDialog.close("cancel");
        closeEditor();
      });
      $("closeViewer").addEventListener("click", () => viewer.close());
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer) viewer.close();
      });
      addButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (e) => {
        await saveSelectedFiles(e.target.files);
        fileInput.value = "";
      });
      async function droppedFiles(dt) {
        const fs = [...(dt.files || [])].filter((f) =>
          f.type.startsWith("image/"),
        );
        if (fs.length) return fs;
        for (const it of [...(dt.items || [])])
          if (it.kind === "file") {
            const f = it.getAsFile();
            if (f?.type.startsWith("image/")) fs.push(f);
          }
        if (fs.length) return fs;
        const urls = [],
          h = dt.getData("text/html");
        if (h) {
          const img = new DOMParser()
            .parseFromString(h, "text/html")
            .querySelector("img");
          if (img)
            urls.push(img.currentSrc || img.src || img.getAttribute("src"));
        }
        const u = dt.getData("text/uri-list");
        if (u)
          urls.push(...u.split(/\r?\n/).filter((x) => x && !x.startsWith("#")));
        const t = dt.getData("text/plain");
        if (/^https?:\/\//i.test(t.trim())) urls.push(t.trim());
        for (const url of [...new Set(urls.filter(Boolean))])
          try {
            const r = await fetch(url, { credentials: "include" });
            if (r.ok) {
              const b = await r.blob();
              if (b.type.startsWith("image/"))
                return [new File([b], "Bild", { type: b.type })];
            }
          } catch (e) {}
        return [];
      }
      let dragDepth = 0;
      function resetDrop() {
        dragDepth = 0;
        addButton.classList.remove("dragover");
        addButton.textContent = "＋ Lägg till bilder";
      }
      addButton.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragDepth++;
        addButton.classList.add("dragover");
        addButton.textContent = "Släpp bilderna här";
      });
      addButton.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });
      addButton.addEventListener("dragleave", (e) => {
        e.preventDefault();
        if (--dragDepth <= 0) resetDrop();
      });
      addButton.addEventListener("drop", async (e) => {
        e.preventDefault();
        resetDrop();
        const fs = await droppedFiles(e.dataTransfer);
        if (fs.length) await saveSelectedFiles(fs);
        else
          alert(
            "Webbläsaren tillät inte att bilden hämtades. Spara bilden först och välj den sedan via knappen.",
          );
      });
      (async () => {
        try {
          db = await openDatabase();
          await render();
        } catch (e) {
          grid.textContent =
            "Kunde inte starta lokal lagring i den här webbläsaren.";
        }
      })();
    </script>
  </body>
</html>
