<!doctype html>
<html lang="sv">
  <head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Teknik projekt.</title>
    <style>
:root {
  color-scheme: dark;

  --bg: #090909;
  --bg-secondary: #101010;
  --panel: #151515;
  --panel-hover: #1b1b1b;

  --text: #f5f5f5;
  --muted: #929292;

  --line: #292929;
  --line-hover: #414141;

  --accent: #e5e5e5;
  --accent-hover: #ffffff;

  --radius: 8px;
  --radius-small: 5px;

  --transition: 180ms ease;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  display: flow-root;
  background:
    radial-gradient(
      ellipse at 50% -20%,
      #242424 0%,
      #111111 42%,
      #090909 80%
    );
  background-attachment: fixed;
  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

header,
nav,
main {
  width: min(1120px, calc(100% - 40px));
  margin: auto;
}

header {
  padding: 42px 0 20px;
}

header h2 {
  margin: 0;
  font-size: clamp(25px, 4vw, 36px);
  font-weight: 600;
  letter-spacing: -1.2px;
  line-height: 1.25;
}

h1,
h2,
h3,
p,
button,
input,
textarea {
  font-family: inherit;
}

h2 {
  letter-spacing: -0.4px;
}

nav {
  padding: 14px 0 25px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

button {
  font: inherit;
  font-size: 13px;
  font-weight: 550;
  cursor: pointer;

  border: 1px solid var(--line);
  border-radius: var(--radius-small);

  padding: 10px 16px;

  background: #191919;
  color: var(--text);

  transition:
    background var(--transition),
    border-color var(--transition),
    color var(--transition),
    transform var(--transition);
}

button:hover {
  background: #252525;
  border-color: var(--line-hover);
}

button:focus-visible {
  outline: 2px solid #888;
  outline-offset: 3px;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.45;
  cursor: wait;
}

#add,
.primary {
  background: #ededed;
  color: #111111;
  border-color: #ededed;
  font-weight: 650;
}

#add:hover,
.primary:hover {
  background: #ffffff;
  border-color: #ffffff;
  color: #000000;
}

#add {
  min-width: 180px;
  transition: var(--transition);
}

#add:hover,
#add.dragover {
  transform: translateY(-1px);
}

#file {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  padding-bottom: 45px;
}

.card {
  position: relative;
  min-width: 0;

  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);

  overflow: hidden;

  transition:
    border-color var(--transition),
    background var(--transition),
    transform var(--transition);
}

.card:hover {
  border-color: var(--line-hover);
  background: var(--panel-hover);
  transform: translateY(-2px);
}

.photo {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: #202020;
  cursor: zoom-in;
}

.details {
  padding: 15px 16px 17px;
}

.details h2 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.2px;
  margin: 0 0 5px;
}

.details p {
  font-size: 13px;
  line-height: 1.65;
  color: var(--muted);
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.actions {
  position: absolute;
  right: 10px;
  top: 10px;

  display: flex;
  gap: 7px;
}

.icon-btn {
  width: 35px;
  height: 35px;
  padding: 0;

  display: grid;
  place-items: center;

  background: #101010dd;
  border: 1px solid #ffffff25;

  backdrop-filter: blur(10px);
}

.icon-btn:hover {
  background: #292929;
}

.icon-btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-btn.delete:hover {
  background: #572929;
  border-color: #854444;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  padding: 75px 20px;

  background: #111111;
  border: 1px dashed #333333;
  border-radius: var(--radius);

  font-size: 14px;
}

dialog {
  width: min(92vw, 520px);
  max-height: 90vh;
  overflow: auto;

  border: 1px solid #353535;
  border-radius: 10px;

  padding: 25px;

  background: #151515;
  color: var(--text);

  box-shadow: 0 25px 80px #00000090;
}

dialog::backdrop {
  background: #000000b8;
  backdrop-filter: blur(5px);
}

dialog h2 {
  margin: 0 0 18px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.5px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 550;
  color: #b5b5b5;
  margin: 15px 0 7px;
}

input[type="text"],
input[type="password"],
input[type="email"],
textarea {
  width: 100%;

  font: inherit;
  font-size: 14px;

  color: var(--text);
  background: #0d0d0d;

  border: 1px solid #303030;
  border-radius: var(--radius-small);

  padding: 12px 13px;

  outline: none;

  transition:
    border-color var(--transition),
    background var(--transition);
}

input:focus,
textarea:focus {
  border-color: #777777;
  background: #121212;
}

input::placeholder,
textarea::placeholder {
  color: #666666;
}

textarea {
  resize: vertical;
  min-height: 100px;
}

.preview {
  display: block;
  max-width: 100%;
  max-height: 210px;
  object-fit: contain;
  margin: 0 auto 16px;
  border-radius: var(--radius-small);
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 22px;
}

#viewer {
  width: min(96vw, 1100px);
  padding: 0;

  background: #090909;
  border-radius: 8px;

  position: relative;
}

#viewer img {
  display: block;
  max-width: 100%;
  max-height: 82vh;
  object-fit: contain;
  margin: auto;
}

.viewer-bar {
  display: flex;
  justify-content: center;
  padding: 13px 16px;
}

.viewer-bar strong {
  font-size: 13px;
  font-weight: 500;
  color: #a0a0a0;
}

.close {
  position: absolute;
  right: 12px;
  top: 12px;

  width: 36px;
  height: 36px;
  padding: 0;

  border-radius: 6px;
  background: #111111dd;

  z-index: 2;
}

#loginScreen {
  width: min(92vw, 420px);
  margin: 12vh auto 40px;
  padding: 30px;

  background: #141414;
  border: 1px solid #303030;
  border-radius: 10px;

  box-shadow: 0 20px 70px #00000050;
}

#loginScreen h2 {
  margin: 0 0 8px;
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -0.8px;
}

#loginScreen p,
.muted {
  color: var(--muted);
  font-size: 13px;
}

#loginScreen button {
  width: 100%;
  margin-top: 18px;
}

#loginScreen input {
  margin-top: 2px;
}

#app[hidden],
#loginScreen[hidden] {
  display: none !important;
}

#status {
  width: min(1120px, calc(100% - 40px));
  margin: 0 auto 16px;

  color: var(--muted);
  font-size: 12px;
  min-height: 1.4em;
}

::selection {
  background: #777777;
  color: #ffffff;
}

@media (max-width: 800px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 540px) {
  header {
    padding-top: 28px;
  }

  header h2 {
    font-size: 25px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .photo {
    aspect-ratio: 5 / 4;
  }

  #loginScreen {
    padding: 24px;
    margin-top: 8vh;
  }

  nav {
    gap: 8px;
  }

  #add {
    flex: 1;
  }
}

    </style>
  </head>
  <body>
    <section id="loginScreen">
      <h2>
        Teknik projekt<span style="color: var(--accent)">.</span>
      </h2>
      <p>Ange PIN-koden för att öppna.</p>
      <form id="loginForm">
        <label for="pin">PIN-kod</label>
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          required
          maxlength="128"
          placeholder="Ange PIN-kod"
        />
        <button class="primary" id="loginButton" type="submit">
          Öppna sidan.
        </button>
      </form>
      <p id="loginError" role="alert" aria-live="polite"></p>
    </section>

    <div id="app" hidden>
      <header>
        <h2>
          Teknik projekt: Matteus, Abdi, Theo, Wenji, Alicia och Julie.<span style="color: var(--accent)">.</span>
        </h2>
      </header>
      <nav>
        <button id="add" type="button">＋ Lägg till bilder</button>
        <input id="file" type="file" accept="image/*" multiple />
        <button id="logout" type="button">Logga ut</button>
      </nav>
      <div id="status" role="status" aria-live="polite"></div>
      <main>
        <section class="grid" id="grid" aria-label="Bildalbum"></section>
      </main>
    </div>

    <dialog id="editDialog">
      <form id="editForm">
        <h2 id="formHeading">Lägg till bild</h2>
        <img id="preview" class="preview" alt="" />
        <label for="title">Bildens namn</label
        ><input
          id="title"
          type="text"
          maxlength="100"
          placeholder="Skriv ett namn"
        />
        <label for="caption">Text under bilden</label
        ><textarea
          id="caption"
          maxlength="1000"
          placeholder="Skriv en beskrivning eller annan text..."
        ></textarea>
        <div class="form-actions">
          <button type="button" id="cancel">Avbryt</button
          ><button class="primary" type="submit">Spara</button>
        </div>
      </form>
    </dialog>
    <dialog id="viewer">
      <button
        class="close"
        id="closeViewer"
        type="button"
        aria-label="Stäng"
        title="Stäng"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg></button
      ><img id="large" alt="" />
      <div class="viewer-bar"><strong id="viewerTitle"></strong></div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://htmafwhpgabwapneqzaz.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_Vszdpz_SRGlPj3lbrtBaDA_Dd3IT8oA";
      const ALBUM_LOGIN_EMAIL = "album-access@example.com";
      const BUCKET = "album-photos";
      const TABLE = "photos";

      const $ = (id) => document.getElementById(id);
      const grid = $("grid"),
        fileInput = $("file"),
        addButton = $("add");
      const editDialog = $("editDialog"),
        viewer = $("viewer");
      let supabaseClient = null,
        pendingFile = null,
        editingPhoto = null,
        previewUrl = null;
      let activeUrls = [];

      function setStatus(message) {
        $("status").textContent = message || "";
      }
      function showLogin(message = "") {
        $("app").hidden = true;
        $("loginScreen").hidden = false;
        $("loginError").textContent = message;
        $("pin").value = "";
      }
      function showApp() {
        $("loginScreen").hidden = true;
        $("app").hidden = false;
      }
      function friendlyError(error) {
        const msg =
          error?.message || String(error || "Ett okänt fel inträffade.");
        return msg;
      }
      async function verifyPin(action) {
        const pin = prompt("Ange PIN-koden igen för att " + action + ".");
        if (pin === null) return false;

        await supabaseClient.auth.signOut();

        const { error } = await supabaseClient.auth.signInWithPassword({
          email: ALBUM_LOGIN_EMAIL,
          password: pin,
        });

        if (error) {
          alert("Fel PIN-kod. Åtgärden har inte genomförts.");
          return false;
        }

        return true;
      }
      function requireConfig() {
        if (!window.supabase)
          throw new Error(
            "Supabase-biblioteket kunde inte laddas. Kontrollera internetanslutningen.",
          );
        if (
          SUPABASE_URL.includes("PASTE_") ||
          SUPABASE_ANON_KEY.includes("PASTE_")
        ) {
          throw new Error(
            "Webbplatsen behöver konfigureras med din Supabase Project URL och anon key innan den kan användas.",
          );
        }
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: false,
              autoRefreshToken: true,
              detectSessionInUrl: false,
            },
          },
        );
      }
      function iconButton(cls, label, path) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "icon-btn " + cls;
        b.title = label;
        b.setAttribute("aria-label", label);
        b.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true">' + path + "</svg>";
        return b;
      }
      async function signedPhotoUrl(path) {
        const { data, error } = await supabaseClient.storage
          .from(BUCKET)
          .createSignedUrl(path, 3600);
        if (error) throw error;
        return data.signedUrl;
      }
      async function render() {
        activeUrls.forEach((u) => URL.revokeObjectURL(u));
        activeUrls = [];
        grid.replaceChildren();
        const { data: photos, error } = await supabaseClient
          .from(TABLE)
          .select("id,path,title,caption,created_at")
          .order("created_at", { ascending: false });
        if (error) throw error;
        if (!photos || !photos.length) {
          const e = document.createElement("div");
          e.className = "empty";
          e.textContent =
            "Lägg till en första bild.";
          grid.append(e);
          return;
        }
        for (const p of photos) {
          const card = document.createElement("article");
          card.className = "card";
          const img = document.createElement("img");
          img.className = "photo";
          img.alt = p.title || "Foto";
          img.loading = "lazy";
          try {
            img.src = await signedPhotoUrl(p.path);
          } catch (err) {
            img.alt = "Bilden kunde inte laddas";
          }
          img.addEventListener("click", () =>
            openViewer(img.src, p.title || "Foto"),
          );
          const d = document.createElement("div");
          d.className = "details";
          const h = document.createElement("h2");
          h.textContent = p.title || "Namnlös bild";
          d.append(h);
          if (p.caption) {
            const t = document.createElement("p");
            t.textContent = p.caption;
            d.append(t);
          }
          const actions = document.createElement("div");
          actions.className = "actions";
          const edit = iconButton(
            "",
            "Redigera",
            '<path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/>',
          );
          edit.addEventListener("click", () => openEditor(p));
          const del = iconButton(
            "delete",
            "Ta bort",
            '<path d="M3 6h18M8 6V4h8v2m3 0-.8 14H5.8L5 6m4 4v6m6-6v6"/>',
          );
          del.addEventListener("click", () => deletePhoto(p));
          actions.append(edit, del);
          card.append(img, d, actions);
          grid.append(card);
        }
      }
      function openViewer(url, title) {
        $("large").src = url;
        $("large").alt = title;
        $("viewerTitle").textContent = title;
        viewer.showModal();
      }
      function openEditor(p = null) {
        editingPhoto = p;
        pendingFile = null;
        $("formHeading").textContent = p ? "Redigera bild" : "Lägg till bild";
        $("title").value = p?.title || "";
        $("caption").value = p?.caption || "";
        $("preview").hidden = true;
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        if (p) {
          $("preview").hidden = false;
          signedPhotoUrl(p.path)
            .then((url) => {
              $("preview").src = url;
            })
            .catch(() => {});
        } else if (pendingFile) {
          previewUrl = URL.createObjectURL(pendingFile);
          $("preview").src = previewUrl;
          $("preview").hidden = false;
        }
        editDialog.showModal();
        $("title").focus();
      }
      function closeEditor() {
        if (editDialog.open) editDialog.close();
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        pendingFile = null;
        editingPhoto = null;
      }
      async function saveNewFile(file, title, caption) {
        const authorized = await verifyPin("ladda upp bilden");
        if (!authorized) return false;

        const ext =
          (file.name.split(".").pop() || "jpg")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "") || "jpg";
        const path = crypto.randomUUID() + "." + ext;
        setStatus("Laddar upp " + file.name + "…");
        const { error: uploadError } = await supabaseClient.storage
          .from(BUCKET)
          .upload(path, file, { contentType: file.type, upsert: false });
        if (uploadError) throw uploadError;
        const { error: rowError } = await supabaseClient
          .from(TABLE)
          .insert({ path, title, caption });
        if (rowError) {
          await supabaseClient.storage.from(BUCKET).remove([path]);
          throw rowError;
        }
        return true;
      }
      async function deletePhoto(p) {
        const authorized = await verifyPin("ta bort bilden");
        if (!authorized) return;
        if (
          !confirm(
            'Är du säker på att du vill ta bort "' +
              (p.title || "bilden") +
              '"?',
          )
        )
          return;
        setStatus("Tar bort bilden…");
        const { error: rowError } = await supabaseClient
          .from(TABLE)
          .delete()
          .eq("id", p.id);
        if (rowError) throw rowError;
        const { error: storageError } = await supabaseClient.storage
          .from(BUCKET)
          .remove([p.path]);
        if (storageError) throw storageError;
        await render();
        setStatus("Bilden har tagits bort.");
      }
      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("loginButton").disabled = true;
        $("loginError").textContent = "";
        try {
          const pin = $("pin").value;
          const { error } = await supabaseClient.auth.signInWithPassword({
            email: ALBUM_LOGIN_EMAIL,
            password: pin,
          });
          if (error) throw error;
          showApp();
          setStatus("Laddar albumet…");
          await render();
          setStatus("");
        } catch (err) {
          showLogin(
            err.message.includes("Invalid login")
              ? "Fel PIN-kod. Försök igen."
              : friendlyError(err),
          );
        } finally {
          $("loginButton").disabled = false;
        }
      });
      $("logout").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        showLogin();
        grid.replaceChildren();
        setStatus("");
      });
      $("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = $("title").value.trim() || "Namnlös bild",
          caption = $("caption").value.trim();
        try {
          if (editingPhoto) {
            const authorized = await verifyPin("redigera bilden");
            if (!authorized) return;

            const { error } = await supabaseClient
              .from(TABLE)
              .update({ title, caption })
              .eq("id", editingPhoto.id);
            if (error) throw error;
          } else if (pendingFile) {
            editDialog.close("save");
            return;
          }
          closeEditor();
          await render();
          setStatus("Sparat.");
        } catch (err) {
          alert("Kunde inte spara: " + friendlyError(err));
        }
      });
      $("cancel").addEventListener("click", closeEditor);
      $("closeViewer").addEventListener("click", () => viewer.close());
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer) viewer.close();
      });
      addButton.addEventListener("click", () => fileInput.click());
      async function processFiles(files) {
        for (const f of [...files].filter((x) => x.type.startsWith("image/"))) {
          pendingFile = f;
          editingPhoto = null;
          $("formHeading").textContent = "Lägg till bild";
          $("title").value = f.name.replace(/\.[^.]+$/, "");
          $("caption").value = "";
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(f);
          $("preview").src = previewUrl;
          $("preview").hidden = false;
          editDialog.showModal();
          await new Promise((resolve) =>
            editDialog.addEventListener("close", resolve, { once: true }),
          );
          if (editDialog.returnValue === "save") {
            try {
              await saveNewFile(
                f,
                $("title").value.trim() || "Namnlös bild",
                $("caption").value.trim(),
              );
            } catch (err) {
              alert("Kunde inte ladda upp bilden: " + friendlyError(err));
            }
          }
          if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
            previewUrl = null;
          }
          pendingFile = null;
          await render();
        }
        setStatus("");
      }
      $("cancel").addEventListener("click", () => {
        if (editDialog.open) editDialog.close("cancel");
      });
      fileInput.addEventListener("change", async (e) => {
        try {
          await processFiles(e.target.files);
        } finally {
          fileInput.value = "";
        }
      });
      let dragDepth = 0;
      function resetDrop() {
        dragDepth = 0;
        addButton.classList.remove("dragover");
        addButton.textContent = "＋ Lägg till bilder";
      }
      addButton.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragDepth++;
        addButton.classList.add("dragover");
        addButton.textContent = "Släpp bilderna här";
      });
      addButton.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });
      addButton.addEventListener("dragleave", (e) => {
        e.preventDefault();
        if (--dragDepth <= 0) resetDrop();
      });
      addButton.addEventListener("drop", async (e) => {
        e.preventDefault();
        resetDrop();
        const files = [...(e.dataTransfer.files || [])];
        if (files.length) {
          try {
            await processFiles(files);
          } catch (err) {
            alert(friendlyError(err));
          }
        }
      });
      window.addEventListener("pageshow", (event) => {
        if (event.persisted && supabaseClient) {
          supabaseClient.auth.signOut();
          showLogin();
          grid.replaceChildren();
          setStatus("");
        }
      });

      (async () => {
        try {
          requireConfig();
          const {
            data: { session },
          } = await supabaseClient.auth.getSession();
          if (session) {
            showApp();
            await render();
          } else showLogin();
        } catch (err) {
          showLogin(friendlyError(err));
        }
      })();
    </script>
  </body>
</html>
