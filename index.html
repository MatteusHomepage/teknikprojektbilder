<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101312" />
    <title>Teknik projekt: Matteus, Abdi, Theo, Wenji, Alicia och Julie.</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101312;
        --panel: #191e1c;
        --text: #f2f5f2;
        --muted: #9ba8a1;
        --line: #303a34;
        --accent: #b9e4c9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -20%, #29372f, transparent 55%),
          var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      header,
      nav,
      main {
        width: min(1120px, calc(100% - 36px));
        margin: auto;
      }
      header {
        padding: 34px 0 16px;
      }
      h1 {
        font-size: clamp(34px, 6vw, 56px);
        line-height: 1;
        letter-spacing: -0.05em;
        margin: 0;
      }
      nav {
        padding: 12px 0 22px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 16px;
        background: #202824;
        color: var(--text);
      }
      button:hover,
      button:focus-visible {
        outline: none;
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      #add,
      .primary {
        background: var(--accent);
        color: #142019;
        border-color: var(--accent);
        font-weight: 650;
      }
      #add {
        min-width: 180px;
        transition: 0.18s;
      }
      #add:hover,
      #add.dragover {
        background: #d0f0dc;
        transform: translateY(-1px);
      }
      #file {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        padding-bottom: 36px;
      }
      .card {
        position: relative;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .photo {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        background: #252b28;
        cursor: zoom-in;
      }
      .details {
        padding: 12px 14px 15px;
      }
      .details h2 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .details p {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .actions {
        position: absolute;
        right: 9px;
        top: 9px;
        display: flex;
        gap: 7px;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        background: #111a18dd;
        backdrop-filter: blur(8px);
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-btn.delete:hover {
        background: #913b3b;
        border-color: #e58a8a;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        color: var(--muted);
        padding: 70px 16px;
        border: 1px dashed var(--line);
        border-radius: 14px;
      }
      dialog {
        width: min(92vw, 520px);
        max-height: 90vh;
        overflow: auto;
        border: 1px solid #48534c;
        border-radius: 16px;
        padding: 22px;
        background: #171d19;
        color: var(--text);
      }
      dialog::backdrop {
        background: #000b;
        backdrop-filter: blur(4px);
      }
      dialog h2 {
        margin: 0 0 16px;
        font-size: 21px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 13px 0 6px;
      }
      input[type="text"],
      input[type="password"],
      input[type="email"],
      textarea {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: #0f1411;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 11px;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      .preview {
        display: block;
        max-width: 100%;
        max-height: 210px;
        object-fit: contain;
        margin: 0 auto 14px;
        border-radius: 8px;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      #viewer {
        width: min(96vw, 1100px);
        padding: 0;
        background: #101312;
        border-radius: 14px;
        position: relative;
      }
      #viewer img {
        display: block;
        max-width: 100%;
        max-height: 82vh;
        object-fit: contain;
        margin: auto;
      }
      .viewer-bar {
        display: flex;
        justify-content: center;
        padding: 10px 14px;
      }
      .viewer-bar strong {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
      }
      .close {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        background: #111a18dd;
        z-index: 2;
      }
      #loginScreen {
        width: min(92vw, 430px);
        margin: 10vh auto 40px;
        padding: 26px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      #loginScreen h2 {
        margin: 0 0 8px;
      }
      #loginScreen p,
      .muted {
        color: var(--muted);
      }
      #loginScreen button {
        width: 100%;
        margin-top: 16px;
      }
      #app[hidden],
      #loginScreen[hidden] {
        display: none !important;
      }
      #status {
        width: min(1120px, calc(100% - 36px));
        margin: 0 auto 14px;
        color: var(--muted);
        font-size: 13px;
        min-height: 1.4em;
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 540px) {
        header {
          padding-top: 26px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .photo {
          aspect-ratio: 5/4;
        }
      }
    </style>
  </head>
  <body>
    <section id="loginScreen">
      <h2>
        Matteus's Ai Photo Album<span style="color: var(--accent)">.</span>
      </h2>
      <p>Ange albumets PIN-kod för att fortsätta.</p>
      <form id="loginForm">
        <label for="pin">PIN-kod</label>
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          required
          maxlength="128"
          placeholder="Ange PIN-kod"
        />
        <button class="primary" id="loginButton" type="submit">
          Öppna albumet
        </button>
      </form>
      <p id="loginError" role="alert" aria-live="polite"></p>
    </section>

    <div id="app" hidden>
      <header>
        <h1>
          Matteus's Ai Photo Album<span style="color: var(--accent)">.</span>
        </h1>
      </header>
      <nav>
        <button id="add" type="button">＋ Lägg till bilder</button>
        <input id="file" type="file" accept="image/*" multiple />
        <button id="logout" type="button">Logga ut</button>
      </nav>
      <div id="status" role="status" aria-live="polite"></div>
      <main>
        <section class="grid" id="grid" aria-label="Bildalbum"></section>
      </main>
    </div>

    <dialog id="editDialog">
      <form id="editForm">
        <h2 id="formHeading">Lägg till bild</h2>
        <img id="preview" class="preview" alt="" />
        <label for="title">Bildens namn</label
        ><input
          id="title"
          type="text"
          maxlength="100"
          placeholder="Skriv ett namn"
        />
        <label for="caption">Text under bilden</label
        ><textarea
          id="caption"
          maxlength="1000"
          placeholder="Skriv en beskrivning eller annan text..."
        ></textarea>
        <div class="form-actions">
          <button type="button" id="cancel">Avbryt</button
          ><button class="primary" type="submit">Spara</button>
        </div>
      </form>
    </dialog>
    <dialog id="viewer">
      <button
        class="close"
        id="closeViewer"
        type="button"
        aria-label="Stäng"
        title="Stäng"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg></button
      ><img id="large" alt="" />
      <div class="viewer-bar"><strong id="viewerTitle"></strong></div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://htmafwhpgabwapneqzaz.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_Vszdpz_SRGlPj3lbrtBaDA_Dd3IT8oA";
      const ALBUM_LOGIN_EMAIL = "album-access@example.com";
      const BUCKET = "album-photos";
      const TABLE = "photos";

      const $ = (id) => document.getElementById(id);
      const grid = $("grid"),
        fileInput = $("file"),
        addButton = $("add");
      const editDialog = $("editDialog"),
        viewer = $("viewer");
      let supabaseClient = null,
        pendingFile = null,
        editingPhoto = null,
        previewUrl = null;
      let activeUrls = [];

      function setStatus(message) {
        $("status").textContent = message || "";
      }
      function showLogin(message = "") {
        $("app").hidden = true;
        $("loginScreen").hidden = false;
        $("loginError").textContent = message;
        $("pin").value = "";
      }
      function showApp() {
        $("loginScreen").hidden = true;
        $("app").hidden = false;
      }
      function friendlyError(error) {
        const msg =
          error?.message || String(error || "Ett okänt fel inträffade.");
        return msg;
      }
      function requireConfig() {
        if (!window.supabase)
          throw new Error(
            "Supabase-biblioteket kunde inte laddas. Kontrollera internetanslutningen.",
          );
        if (
          SUPABASE_URL.includes("PASTE_") ||
          SUPABASE_ANON_KEY.includes("PASTE_")
        ) {
          throw new Error(
            "Webbplatsen behöver konfigureras med din Supabase Project URL och anon key innan den kan användas.",
          );
        }
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
            },
          },
        );
      }
      function iconButton(cls, label, path) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "icon-btn " + cls;
        b.title = label;
        b.setAttribute("aria-label", label);
        b.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true">' + path + "</svg>";
        return b;
      }
      async function signedPhotoUrl(path) {
        const { data, error } = await supabaseClient.storage
          .from(BUCKET)
          .createSignedUrl(path, 3600);
        if (error) throw error;
        return data.signedUrl;
      }
      async function render() {
        activeUrls.forEach((u) => URL.revokeObjectURL(u));
        activeUrls = [];
        grid.replaceChildren();
        const { data: photos, error } = await supabaseClient
          .from(TABLE)
          .select("id,path,title,caption,created_at")
          .order("created_at", { ascending: false });
        if (error) throw error;
        if (!photos || !photos.length) {
          const e = document.createElement("div");
          e.className = "empty";
          e.textContent =
            "Ditt album är tomt. Lägg till en bild för att börja.";
          grid.append(e);
          return;
        }
        for (const p of photos) {
          const card = document.createElement("article");
          card.className = "card";
          const img = document.createElement("img");
          img.className = "photo";
          img.alt = p.title || "Foto";
          img.loading = "lazy";
          try {
            img.src = await signedPhotoUrl(p.path);
          } catch (err) {
            img.alt = "Bilden kunde inte laddas";
          }
          img.addEventListener("click", () =>
            openViewer(img.src, p.title || "Foto"),
          );
          const d = document.createElement("div");
          d.className = "details";
          const h = document.createElement("h2");
          h.textContent = p.title || "Namnlös bild";
          d.append(h);
          if (p.caption) {
            const t = document.createElement("p");
            t.textContent = p.caption;
            d.append(t);
          }
          const actions = document.createElement("div");
          actions.className = "actions";
          const edit = iconButton(
            "",
            "Redigera",
            '<path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/>',
          );
          edit.addEventListener("click", () => openEditor(p));
          const del = iconButton(
            "delete",
            "Ta bort",
            '<path d="M3 6h18M8 6V4h8v2m3 0-.8 14H5.8L5 6m4 4v6m6-6v6"/>',
          );
          del.addEventListener("click", () => deletePhoto(p));
          actions.append(edit, del);
          card.append(img, d, actions);
          grid.append(card);
        }
      }
      function openViewer(url, title) {
        $("large").src = url;
        $("large").alt = title;
        $("viewerTitle").textContent = title;
        viewer.showModal();
      }
      function openEditor(p = null) {
        editingPhoto = p;
        pendingFile = null;
        $("formHeading").textContent = p ? "Redigera bild" : "Lägg till bild";
        $("title").value = p?.title || "";
        $("caption").value = p?.caption || "";
        $("preview").hidden = true;
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        if (p) {
          $("preview").hidden = false;
          signedPhotoUrl(p.path)
            .then((url) => {
              $("preview").src = url;
            })
            .catch(() => {});
        } else if (pendingFile) {
          previewUrl = URL.createObjectURL(pendingFile);
          $("preview").src = previewUrl;
          $("preview").hidden = false;
        }
        editDialog.showModal();
        $("title").focus();
      }
      function closeEditor() {
        if (editDialog.open) editDialog.close();
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        pendingFile = null;
        editingPhoto = null;
      }
      async function saveNewFile(file, title, caption) {
        const ext =
          (file.name.split(".").pop() || "jpg")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "") || "jpg";
        const path = crypto.randomUUID() + "." + ext;
        setStatus("Laddar upp " + file.name + "…");
        const { error: uploadError } = await supabaseClient.storage
          .from(BUCKET)
          .upload(path, file, { contentType: file.type, upsert: false });
        if (uploadError) throw uploadError;
        const { error: rowError } = await supabaseClient
          .from(TABLE)
          .insert({ path, title, caption });
        if (rowError) {
          await supabaseClient.storage.from(BUCKET).remove([path]);
          throw rowError;
        }
      }
      async function deletePhoto(p) {
        const pin = prompt(
          'Ange PIN-koden igen för att ta bort "' +
            (p.title || "bilden") +
            '".',
        );
        if (pin === null) return;
        const { error: authError } = await supabaseClient.auth.signInWithPassword({
          email: ALBUM_LOGIN_EMAIL,
          password: pin,
        });
        if (authError) {
          alert("Fel PIN-kod. Bilden har inte tagits bort.");
          return;
        }
        if (
          !confirm(
            'Är du säker på att du vill ta bort "' +
              (p.title || "bilden") +
              '"?',
          )
        )
          return;
        setStatus("Tar bort bilden…");
        const { error: rowError } = await supabaseClient
          .from(TABLE)
          .delete()
          .eq("id", p.id);
        if (rowError) throw rowError;
        const { error: storageError } = await supabaseClient.storage
          .from(BUCKET)
          .remove([p.path]);
        if (storageError) throw storageError;
        await render();
        setStatus("Bilden har tagits bort.");
      }
      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("loginButton").disabled = true;
        $("loginError").textContent = "";
        try {
          const pin = $("pin").value;
          const { error } = await supabaseClient.auth.signInWithPassword({
            email: ALBUM_LOGIN_EMAIL,
            password: pin,
          });
          if (error) throw error;
          showApp();
          setStatus("Laddar albumet…");
          await render();
          setStatus("");
        } catch (err) {
          showLogin(
            err.message.includes("Invalid login")
              ? "Fel PIN-kod. Försök igen."
              : friendlyError(err),
          );
        } finally {
          $("loginButton").disabled = false;
        }
      });
      $("logout").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        showLogin();
        grid.replaceChildren();
        setStatus("");
      });
      $("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = $("title").value.trim() || "Namnlös bild",
          caption = $("caption").value.trim();
        try {
          if (editingPhoto) {
            const { error } = await supabaseClient
              .from(TABLE)
              .update({ title, caption })
              .eq("id", editingPhoto.id);
            if (error) throw error;
          } else if (pendingFile) {
            editDialog.close("save");
            return;
          }
          closeEditor();
          await render();
          setStatus("Sparat.");
        } catch (err) {
          alert("Kunde inte spara: " + friendlyError(err));
        }
      });
      $("cancel").addEventListener("click", closeEditor);
      $("closeViewer").addEventListener("click", () => viewer.close());
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer) viewer.close();
      });
      addButton.addEventListener("click", () => fileInput.click());
      async function processFiles(files) {
        for (const f of [...files].filter((x) => x.type.startsWith("image/"))) {
          pendingFile = f;
          editingPhoto = null;
          $("formHeading").textContent = "Lägg till bild";
          $("title").value = f.name.replace(/\.[^.]+$/, "");
          $("caption").value = "";
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(f);
          $("preview").src = previewUrl;
          $("preview").hidden = false;
          editDialog.showModal();
          await new Promise((resolve) =>
            editDialog.addEventListener("close", resolve, { once: true }),
          );
          if (editDialog.returnValue === "save") {
            try {
              await saveNewFile(
                f,
                $("title").value.trim() || "Namnlös bild",
                $("caption").value.trim(),
              );
            } catch (err) {
              alert("Kunde inte ladda upp bilden: " + friendlyError(err));
            }
          }
          if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
            previewUrl = null;
          }
          pendingFile = null;
          await render();
        }
        setStatus("");
      }
      $("cancel").addEventListener("click", () => {
        if (editDialog.open) editDialog.close("cancel");
      });
      fileInput.addEventListener("change", async (e) => {
        try {
          await processFiles(e.target.files);
        } finally {
          fileInput.value = "";
        }
      });
      let dragDepth = 0;
      function resetDrop() {
        dragDepth = 0;
        addButton.classList.remove("dragover");
        addButton.textContent = "＋ Lägg till bilder";
      }
      addButton.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragDepth++;
        addButton.classList.add("dragover");
        addButton.textContent = "Släpp bilderna här";
      });
      addButton.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });
      addButton.addEventListener("dragleave", (e) => {
        e.preventDefault();
        if (--dragDepth <= 0) resetDrop();
      });
      addButton.addEventListener("drop", async (e) => {
        e.preventDefault();
        resetDrop();
        const files = [...(e.dataTransfer.files || [])];
        if (files.length) {
          try {
            await processFiles(files);
          } catch (err) {
            alert(friendlyError(err));
          }
        }
      });
      (async () => {
        try {
          requireConfig();
          const {
            data: { session },
          } = await supabaseClient.auth.getSession();
          if (session) {
            showApp();
            await render();
          } else showLogin();
        } catch (err) {
          showLogin(friendlyError(err));
        }
      })();
    </script>
  </body>
</html>
